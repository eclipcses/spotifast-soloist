name: Soloist Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: soloist-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Windows checks
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # Keep test behavior and assertions, but avoid large Windows PDBs.
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: soloist-windows-checks
          cache-on-failure: true
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Policy and formatting
        shell: pwsh
        run: |
          python .github/scripts/check-dependency-sources.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .github/scripts/check-review-evidence.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test packaging/soloist-release.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --all --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Clippy
        run: cargo clippy --locked --no-default-features --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked --no-default-features --all-targets
      - name: Native credential store, dummy grants only
        run: cargo test --locked --no-default-features --lib credentials::tests::native_store_round_trip -- --ignored --exact
      - name: Documentation tests
        run: cargo test --locked --no-default-features --doc

  release:
    name: Build signed Windows release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      # Published binaries are built fresh, never restored from compiler cache.
      - name: Verify version and build
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag does not match Cargo.toml' }
          cargo build --release --locked --no-default-features --target x86_64-pc-windows-msvc --bin spotifast
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $binary = 'target\x86_64-pc-windows-msvc\release\spotifast.exe'
          $reported = (& $binary --version | Out-String).Trim()
          if ($reported -ne "spotifast $version") { throw 'Executable version mismatch' }
          $imports = & dumpbin /dependents $binary | Out-String
          if ($imports -match 'MSVCP[0-9_]*\.dll|VCRUNTIME[0-9_]*\.dll') { throw 'Executable requires an external MSVC runtime' }
          $headers = & dumpbin /headers $binary | Out-String
          if ($headers -notmatch '8664 machine \(x64\)') { throw 'Executable is not Windows x64' }
      - name: Portable package and Inno installer
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $stem = "spotifast-v$version-x86_64-pc-windows-msvc"
          $payload = Join-Path $env:RUNNER_TEMP $stem
          New-Item -ItemType Directory -Path $payload -Force | Out-Null
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/spotifast.exe,LICENSE,README.md,SOLOIST-WINDOWS.md,packaging/spotifast-portable.txt $payload
          Compress-Archive -LiteralPath $payload -DestinationPath "dist/$stem.zip"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DVersion=$version" /DArch=x86_64 "/DBinary=$PWD\target\x86_64-pc-windows-msvc\release\spotifast.exe" "/DOutputDir=$PWD\dist" packaging/windows/spotifast.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows Installer package
        shell: pwsh
        run: |
          dotnet tool install wix --version 5.0.2 --tool-path "$env:RUNNER_TEMP\wix"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PATH = "$env:RUNNER_TEMP\wix;$env:PATH"
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $payload = Join-Path $env:RUNNER_TEMP 'soloist-msi-payload'
          New-Item -ItemType Directory -Path $payload | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/spotifast.exe,LICENSE,README.md,packaging/spotifast-installer.txt $payload
          python packaging/windows/build-msi.py $payload "dist/spotifast-v$version-x86_64-pc-windows-msvc.msi" $version amd64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Sign and verify release manifest
        env:
          SPOTIFAST_UPDATE_SIGNING_KEY: ${{ secrets.SPOTIFAST_UPDATE_SIGNING_KEY }}
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          node packaging/soloist-release.cjs dist $version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create $env:GITHUB_REF_NAME dist/* --verify-tag --title "Spotifast Soloist $env:GITHUB_REF_NAME" --notes-file "packaging/release-notes/$env:GITHUB_REF_NAME.md" --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
